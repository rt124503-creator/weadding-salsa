<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Agung & Salsa — Undangan</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Georgia,"Times New Roman",serif}
    .cover {
  position: relative;
  width: 100%;
  height: 100dvh;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  background: #000;
}

.cover-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  z-index: 0;
}
    .overlay{position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:1}
    .content{position:relative;z-index:2;width:min(90%,500px);text-align:center;padding:30px 20px;text-shadow:0 2px 12px rgba(0,0,0,.75)}
    .small-title{font-size:clamp(13px,3.5vw,18px);letter-spacing:3px;text-transform:uppercase;margin-bottom:22px}
    .guest-label{font-size:clamp(13px,3.8vw,17px);margin-bottom:7px}
    #guestName{font-size:clamp(25px,7vw,38px);font-weight:700;margin-bottom:35px;line-height:1.2}
    .couple{font-size:clamp(34px,10vw,58px);line-height:1.1;font-weight:500;margin-bottom:32px}
    .invitation-text{font-family:Arial,sans-serif;font-size:clamp(12px,3.4vw,15px);line-height:1.7;margin:0 auto 28px;max-width:360px}
    .open-button{
      display:inline-flex;align-items:center;justify-content:center;min-width:190px;min-height:50px;
      padding:13px 28px;border:1px solid rgba(255,255,255,.75);border-radius:30px;
      background:rgba(0,0,0,.55);color:#fff;text-decoration:none;font-family:Arial,sans-serif;
      font-size:14px;letter-spacing:1.5px;transition:.25s ease;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);cursor:pointer
    }
    .open-button:hover,.open-button:active{background:rgba(255,255,255,.18);transform:translateY(-2px)}
    .credit{position:absolute;z-index:2;bottom:15px;left:0;width:100%;text-align:center;font-family:Arial,sans-serif;font-size:9px;letter-spacing:1px;opacity:.65}
    @media(max-width:600px){.content{padding:20px}.guest-label{margin-bottom:5px}#guestName{margin-bottom:27px}.couple{margin-bottom:25px}.invitation-text{margin-bottom:22px}}
  </style>
</head>
<body>
  <main class="cover">
    <video class="cover-video" autoplay muted loop playsinline
       preload="auto" aria-hidden="true">
  <source src="Cover.mp4" type="video/mp4">
  Browser Anda tidak mendukung video.
</video>
    <audio id="music" loop preload="auto">
      <source src="music.mp3" type="audio/mpeg">
    </audio>
    <div class="overlay"></div>
    <section class="content">
      <div class="small-title">The Wedding Of</div>
      <div class="guest-label">Kepada Yth.</div>
      <div id="guestName">Tamu Undangan</div>
      <h1 class="couple">Agung &amp; Salsa</h1>
      <p class="invitation-text">Dengan penuh kebahagiaan, kami mengundang Anda untuk hadir dan menjadi bagian dari hari istimewa kami.</p>
      <a class="open-button"
         href="https://preview.canva.site/32d278b2-36bc-45a5-b034-a788b438b2e2/weddingsalsa.com/"
         target="_blank" rel="noopener noreferrer" onclick="playMusic()">BUKA UNDANGAN</a>
    </section>
    <div class="credit">A MOMENT TO REMEMBER</div>
  </main>
  <script>
    const params=new URLSearchParams(window.location.search);
    const guest=params.get("to");
    if(guest&&guest.trim()){
      const name=guest.trim();
      document.getElementById("guestName").textContent=name;
      document.title="Undangan untuk "+name+" — Agung & Salsa";
    }
    function playMusic(){
      const music=document.getElementById("music");
      music.play().catch(()=>{});
    }
  </script>
</body>
</html>
